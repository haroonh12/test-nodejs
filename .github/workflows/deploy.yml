name: Deploy to EC2
on:
 push:
   branches:
     - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to EC2
        uses: uses: appleboy/ssh-action@v1.2.0
        with: 
          host: ${{secrets.EC2_HOST}}
          username: ${{secrets.EC2_USER}}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu
            npm install
            pm2 restart demo-app || pm2 start app.js --name demo-app
            pm2 save
